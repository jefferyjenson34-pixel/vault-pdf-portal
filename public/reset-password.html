<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Vault PDF Portal</title>
  <meta name="description" content="Set a new secure password for your Vault PDF Portal account.">
  <link rel="canonical" href="https://vault-pdf-portal.onrender.com/reset-password">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/about.css">
  <link rel="stylesheet" href="/css/futuristic.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Ambient Light Accents -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
  </div>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="/" class="brand-link" aria-label="Vault PDF Portal Home">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span class="brand-name">Vault <span class="brand-highlight">PDF</span></span>
        </a>

        <nav class="nav-menu">
          <a href="/" class="nav-link">Home</a>
          <a href="/login" class="nav-link">Sign In</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-1.5 1.5L12 11l4 4 5.5-5.5a2.12 2.12 0 0 0 0-3L19 4a2.12 2.12 0 0 0-3 0l-1.5 1.5"></path>
            <path d="M12 11l-4 4-2-2-4 4 2 2 4-4 2 2 2-2"></path>
          </svg>
        </div>
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Create a new, strong password for your account.</p>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form class="auth-form" id="reset-form">
        <div class="auth-field">
          <label class="auth-label" for="new-password">New Password (min. 8 characters)</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="new-password" class="auth-input" placeholder="••••••••••••" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="confirm-password">Confirm New Password</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="confirm-password" class="auth-input" placeholder="••••••••••••" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="auth-btn-submit" id="btn-submit">
          <span>Update Password</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Back to <a href="/login">Sign In</a>
      </div>
    </div>
  </main>

  <script src="/js/futuristic.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-submit');

    if (!token) {
      alertBox.className = 'auth-alert error';
      alertBox.textContent = 'Missing password reset token. Please request a new recovery link.';
      alertBox.style.display = 'flex';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword !== confirmPassword) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Passwords do not match.';
        alertBox.style.display = 'flex';
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Updating...</span>';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.className = 'auth-alert success';
          alertBox.innerHTML = `
            <div>
              <strong>Password Reset Complete!</strong><br>
              ${data.message}<br><br>
              <a href="/login" class="btn-primary" style="display:inline-block; padding:6px 14px; text-decoration:none;">Proceed to Sign In &rarr;</a>
            </div>
          `;
          alertBox.style.display = 'flex';
          form.style.display = 'none';
        } else {
          alertBox.className = 'auth-alert error';
          alertBox.textContent = data.error || 'Failed to reset password.';
          alertBox.style.display = 'flex';
        }
      } catch (err) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'flex';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Update Password</span>';
      }
    });
  </script>
</body>
</html>
