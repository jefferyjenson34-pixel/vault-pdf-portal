<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email with OTP — Vault PDF Portal</title>
  <meta name="description" content="Enter your 6-digit one-time password (OTP) to verify your account and activate your encrypted PDF vault.">
  <link rel="canonical" href="https://vault-pdf-portal.onrender.com/verify-email">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/about.css">
  <link rel="stylesheet" href="/css/futuristic.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/chatbot.css">
</head>
<body>

  <!-- Ambient Light Accents -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Header / Navigation -->
  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="/" class="brand-link" aria-label="Vault PDF Portal Home">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span class="brand-name">Vault <span class="brand-highlight">PDF</span></span>
        </a>

        <nav class="nav-menu" id="nav-menu">
          <a href="/" class="nav-link">Home</a>
          <a href="/#documents" class="nav-link">Documents</a>
          <a href="/unlock" class="nav-link">Unlock a PDF</a>
          <a href="/about" class="nav-link">About</a>
          <a href="/contact" class="nav-link">Contact</a>
        </nav>

        <div class="nav-actions">
          <div class="futuristic-nav-group">
            <button class="btn-hud-toggle" id="btn-hud-toggle" title="Toggle Quantum Cyber-Deck HUD Mode">
              <span class="hud-pulse-dot"></span>
              <span>HUD</span>
            </button>
          </div>
          <a href="/login" class="btn-nav-cta">
            <span>Sign In</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-card-header">
        <div class="auth-icon-badge" id="auth-status-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1 class="auth-title" id="page-title">Enter Verification OTP</h1>
        <p class="auth-subtitle" id="page-subtitle">Enter the 6-digit security code sent to your email to activate your account.</p>
      </div>

      <!-- Alert Box -->
      <div class="auth-alert" id="auth-alert"></div>



      <!-- OTP Form -->
      <form class="auth-form" id="otp-form" onsubmit="return false;">
        <div class="auth-field">
          <label class="auth-label" for="verify-email-input">Registered Email Address</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="verify-email-input" class="auth-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-field" style="margin-top: 14px;">
          <label class="auth-label">6-Digit Verification Code (OTP)</label>
          
          <!-- 6 Individual Digit Inputs -->
          <div class="otp-container" id="otp-boxes">
            <input type="text" class="otp-digit-input" maxlength="1" data-idx="0" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" autofocus>
            <input type="text" class="otp-digit-input" maxlength="1" data-idx="1" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-digit-input" maxlength="1" data-idx="2" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-digit-input" maxlength="1" data-idx="3" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-digit-input" maxlength="1" data-idx="4" inputmode="numeric" pattern="[0-9]">
            <input type="text" class="otp-digit-input" maxlength="1" data-idx="5" inputmode="numeric" pattern="[0-9]">
          </div>
        </div>

        <button type="submit" class="auth-btn-submit" id="btn-verify-otp">
          <span>Verify OTP & Activate</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>

        <div class="otp-actions">
          <span>Didn't receive code?</span>
          <button type="button" class="btn-resend-otp" id="btn-resend-otp">Resend OTP</button>
        </div>
      </form>

      <div class="auth-footer" style="margin-top: 24px; border-top: 1px solid var(--border-subtle); padding-top: 16px;">
        Remembered password? <a href="/login">Sign In</a> &bull; <a href="/register">Register New</a>
      </div>
    </div>
  </main>

  <script src="/js/futuristic.js"></script>
  <script>
    (function() {
      'use strict';

      const urlParams = new URLSearchParams(window.location.search);
      const emailParam = urlParams.get('email');
      const otpParam = urlParams.get('otp');
      const tokenParam = urlParams.get('token');

      const emailInput = document.getElementById('verify-email-input');
      const alertBox = document.getElementById('auth-alert');
      const btnSubmit = document.getElementById('btn-verify-otp');
      const btnResend = document.getElementById('btn-resend-otp');
      const digitInputs = document.querySelectorAll('.otp-digit-input');

      let currentEmail = emailParam ? decodeURIComponent(emailParam).trim() : '';
      if (currentEmail) {
        emailInput.value = currentEmail;
      }

      // If OTP was passed via direct verification link, fill boxes
      if (otpParam && /^\d{6}$/.test(otpParam)) {
        fillOtpBoxes(otpParam);
      }

      // ─── 6-Digit Box Auto-Focus & Navigation ───────────────────────
      digitInputs.forEach((input, idx) => {
        // Typing digits
        input.addEventListener('input', (e) => {
          const val = input.value.replace(/[^0-9]/g, '');
          input.value = val ? val.slice(-1) : '';

          if (val && idx < digitInputs.length - 1) {
            digitInputs[idx + 1].focus();
          }

          // Check if all filled
          if (getEnteredOtp().length === 6) {
            btnSubmit.focus();
          }
        });

        // Keydown (Backspace navigation)
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && idx > 0) {
            digitInputs[idx - 1].focus();
          }
        });

        // Paste support for 6 digits
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text');
          const clean = pasted.replace(/[^0-9]/g, '').slice(0, 6);
          if (clean) {
            fillOtpBoxes(clean);
          }
        });
      });

      function fillOtpBoxes(code) {
        const digits = code.split('');
        digitInputs.forEach((input, i) => {
          input.value = digits[i] || '';
        });
        if (digits.length === 6) {
          digitInputs[5].focus();
        }
      }

      function getEnteredOtp() {
        let code = '';
        digitInputs.forEach(inp => { code += inp.value; });
        return code;
      }

      // ─── Direct Token Link Auto-Verify Fallback ───────────────────
      if (tokenParam && !otpParam) {
        (async function autoVerifyToken() {
          showAlert('info', 'Validating cryptographic security token...');
          try {
            const res = await fetch(`/api/auth/verify-email?token=${encodeURIComponent(tokenParam)}`);
            const data = await res.json();
            if (res.ok) {
              onVerificationSuccess(data.message || 'Email verified successfully!');
            } else {
              showAlert('error', data.error || 'Token verification failed.');
            }
          } catch (e) {
            showAlert('error', 'Network error validating token.');
          }
        })();
      }

      // ─── Verify OTP Form Submission ──────────────────────────────
      const form = document.getElementById('otp-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const otp = getEnteredOtp().trim();

        if (!email) {
          showAlert('error', 'Please enter your registered email address.');
          emailInput.focus();
          return;
        }

        if (otp.length !== 6 || !/^\d{6}$/.test(otp)) {
          showAlert('error', 'Please enter all 6 digits of the OTP code.');
          const firstEmpty = Array.from(digitInputs).find(inp => !inp.value);
          if (firstEmpty) firstEmpty.focus();
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>Verifying OTP...</span>';
        alertBox.style.display = 'none';

        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ email, otp })
          });
          const data = await res.json();

          if (res.ok) {
            onVerificationSuccess(data.message);
          } else {
            showAlert('error', data.error || 'Invalid or expired OTP code.');
          }
        } catch (err) {
          showAlert('error', 'Network communication error. Please try again.');
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Verify OTP & Activate</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
        }
      });

      // ─── Resend OTP Code ─────────────────────────────────────────
      let resendCooldown = 0;
      btnResend.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        if (!email) {
          showAlert('error', 'Please enter your email address to resend OTP.');
          emailInput.focus();
          return;
        }

        if (resendCooldown > 0) return;

        btnResend.disabled = true;
        btnResend.textContent = 'Sending...';

        try {
          const res = await fetch('/api/auth/resend-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (res.ok) {
            showAlert('success', data.message || 'New OTP generated successfully!');
            if (data.otp) {
              fillOtpBoxes(data.otp);
            }
            startCooldown(30);
          } else {
            showAlert('error', data.error || 'Failed to resend OTP.');
            btnResend.disabled = false;
            btnResend.textContent = 'Resend OTP';
          }
        } catch (err) {
          showAlert('error', 'Network error requesting new OTP.');
          btnResend.disabled = false;
          btnResend.textContent = 'Resend OTP';
        }
      });

      function startCooldown(seconds) {
        resendCooldown = seconds;
        btnResend.disabled = true;
        const interval = setInterval(() => {
          resendCooldown--;
          if (resendCooldown <= 0) {
            clearInterval(interval);
            btnResend.disabled = false;
            btnResend.textContent = 'Resend OTP';
          } else {
            btnResend.textContent = `Resend in ${resendCooldown}s`;
          }
        }, 1000);
      }

      // ─── Helpers ─────────────────────────────────────────────────
      function showAlert(type, message) {
        alertBox.className = `auth-alert ${type}`;
        alertBox.textContent = message;
        alertBox.style.display = 'flex';
      }

      function onVerificationSuccess(msg) {
        const badge = document.getElementById('auth-status-badge');
        badge.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        document.getElementById('page-title').textContent = 'Account Verified!';
        document.getElementById('page-subtitle').textContent = 'Your encrypted vault access is fully activated.';
        showAlert('success', `${msg || 'Verification complete!'} Redirecting to your dashboard in 1.5 seconds...`);
        form.style.display = 'none';

        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 1500);
      }

      function showToast(msg) {
        let container = document.getElementById('portal-toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'portal-toast-container';
          container.className = 'portal-toast-container';
          document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = 'portal-toast';
        toast.innerHTML = `<span>${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => toast.remove(), 260);
        }, 2800);
      }
    })();
  </script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
