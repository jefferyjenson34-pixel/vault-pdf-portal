<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Vault PDF Portal</title>
  <meta name="description" content="Reset your Vault PDF Portal account password.">
  <link rel="canonical" href="https://vault-pdf-portal.onrender.com/forgot-password">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/about.css">
  <link rel="stylesheet" href="/css/futuristic.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Ambient Light Accents -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="/" class="brand-link" aria-label="Vault PDF Portal Home">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span class="brand-name">Vault <span class="brand-highlight">PDF</span></span>
        </a>

        <nav class="nav-menu">
          <a href="/" class="nav-link">Home</a>
          <a href="/login" class="nav-link">Sign In</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="auth-title">Password Recovery</h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you a secure link to reset your password.</p>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form class="auth-form" id="forgot-form">
        <div class="auth-field">
          <label class="auth-label" for="forgot-email">Account Email</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="forgot-email" class="auth-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="auth-btn-submit" id="btn-submit">
          <span>Send Recovery Link</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="/login">Back to Sign In</a>
      </div>
    </div>
  </main>

  <script src="/js/futuristic.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const email = document.getElementById('forgot-email').value.trim();
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Processing...</span>';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        alertBox.className = 'auth-alert success';
        alertBox.innerHTML = `
          <div>
            <strong>Request Received:</strong><br>
            ${data.message}<br>
            ${data.resetLink ? `<br><a href="${data.resetLink}" class="btn-primary" style="display:inline-block; padding: 6px 14px; font-size:0.85rem; text-decoration:none;">Click here to Reset Password Now &rarr;</a>` : ''}
          </div>
        `;
        alertBox.style.display = 'flex';
      } catch (err) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'flex';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Send Recovery Link</span>';
      }
    });
  </script>
</body>
</html>
