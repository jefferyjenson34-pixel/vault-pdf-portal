<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Vault PDF Portal</title>
  <meta name="description" content="Reset your Vault PDF Portal account password.">
  <link rel="canonical" href="https://vault-pdf-portal.onrender.com/forgot-password">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/about.css">
  <link rel="stylesheet" href="/css/futuristic.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Ambient Light Accents -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Header -->
  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="/" class="brand-link" aria-label="Vault PDF Portal Home">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span class="brand-name">Vault <span class="brand-highlight">PDF</span></span>
        </a>

        <nav class="nav-menu">
          <a href="/" class="nav-link" id="nav-link-home">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
          </a>
          <a href="/login" class="nav-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            <span>Sign In</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="auth-title">Password Recovery</h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you a secure link to reset your password.</p>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form class="auth-form" id="forgot-form">
        <div class="auth-field">
          <label class="auth-label" for="forgot-email">Account Email</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="forgot-email" class="auth-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <button type="submit" class="auth-btn-submit" id="btn-submit">
          <span>Send Recovery Link</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="/login">Back to Sign In</a>
      </div>
    </div>
  </main>

  <script src="/js/futuristic.js"></script>
  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const email = document.getElementById('forgot-email').value.trim();
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Processing...</span>';

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        alertBox.className = 'auth-alert success';
        alertBox.innerHTML = `
          <div style="width:100%; text-align:left;">
            <div style="font-weight:700; font-size:1rem; margin-bottom:6px; color:#38bdf8;">✓ Password Recovery Request Processed</div>
            <div style="font-size:0.88rem; color:#cbd5e1; line-height:1.5;">
              ${data.emailDispatched
                ? `A recovery email was dispatched to <strong>${escapeHtml(email)}</strong>.`
                : 'A secure recovery link has been generated for your account.'}
            </div>
            <div style="background:rgba(234,179,8,0.12); border:1px solid rgba(234,179,8,0.3); border-radius:8px; padding:10px 12px; margin:12px 0; font-size:0.82rem; color:#fef08a; line-height:1.45;">
              📬 <strong>Check Spam / Junk Folder:</strong> If not visible in your inbox within 60 seconds, please inspect your <strong>Spam / Junk</strong> folder (especially for ProtonMail &amp; Gmail) and click "Not Spam".
            </div>
            ${data.recoveryLink ? `
              <div style="margin-top:12px; text-align:center;">
                <a href="${data.recoveryLink}" style="display:inline-block; background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%); color:#ffffff; font-size:14px; font-weight:700; text-decoration:none; padding:10px 24px; border-radius:10px; box-shadow:0 4px 16px rgba(124,58,237,0.4); letter-spacing:0.01em;">
                  Reset Password Now &rarr;
                </a>
              </div>
            ` : ''}
          </div>
        `;
        alertBox.style.display = 'flex';
      } catch (err) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'flex';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Send Recovery Link</span>';
      }
    });
  </script>
</body>
</html>
