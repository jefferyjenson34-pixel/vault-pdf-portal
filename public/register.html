<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — Vault PDF Portal</title>
  <meta name="description" content="Sign up for Vault PDF Portal to securely manage, privately share, and publish verified PDF documents.">
  <link rel="canonical" href="https://vault-pdf-portal.onrender.com/register">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/register-clean.css">
</head>
<body>
  <a href="#reg-heading" class="skip-to-content">Skip to content</a>

  <!-- Top bar header -->
  <header class="auth-header">
    <div class="auth-header-container">
      <a href="/" class="logo-brand" aria-label="Vault PDF Portal Home">
        <span class="logo-shield" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </span>
        <span>Vault PDF Portal</span>
      </a>

      <div style="display: flex; align-items: center; gap: 12px;">
        <span class="lang-selector-wrap" aria-label="Language: English">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
            <path d="M2 12h20"/>
          </svg>
          <span>English</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </span>
        <a href="/contact" class="btn-outline-support">Support</a>
      </div>
    </div>
  </header>

  <!-- Main column -->
  <main class="auth-main" id="main-content">
    <div class="auth-column">
      
      <h1 class="auth-heading" id="reg-heading">Create Account</h1>
      <p class="auth-subhead">Join Vault PDF Portal to manage and privately share encrypted documents.</p>

      <div class="auth-alert" id="auth-alert" role="alert"></div>

      <form class="auth-form" id="register-form" novalidate>
        <!-- Email field -->
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address <span class="required-star" aria-hidden="true">*</span></label>
          <div class="input-wrapper">
            <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required autocomplete="email" aria-describedby="email-error">
          </div>
          <div id="email-error" class="field-error" role="alert"></div>
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label class="form-label" for="reg-password">Password (min. 8 characters) <span class="required-star" aria-hidden="true">*</span></label>
          <div class="input-wrapper">
            <input type="password" id="reg-password" class="form-input has-eye" placeholder="••••••••••••" minlength="8" required autocomplete="new-password" aria-describedby="password-error">
            <button type="button" id="password-toggle" class="password-toggle-btn" aria-label="Show password">
              <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div id="password-error" class="field-error" role="alert"></div>
        </div>

        <!-- Confirm password field -->
        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm Password <span class="required-star" aria-hidden="true">*</span></label>
          <div class="input-wrapper">
            <input type="password" id="reg-confirm" class="form-input has-eye" placeholder="••••••••••••" minlength="8" required autocomplete="new-password" aria-describedby="confirm-error">
            <button type="button" id="confirm-toggle" class="password-toggle-btn" aria-label="Show password">
              <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div id="confirm-error" class="field-error" role="alert"></div>
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn-primary" id="btn-submit">
          <span>Create Account</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer-link">
        Already have an account? <a href="/login">Sign In</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <nav class="footer-nav" aria-label="Footer navigation">
      <a href="/contact">Support</a>
      <span class="footer-divider" aria-hidden="true">|</span>
      <a href="/#status">System Status</a>
      <span class="footer-divider" aria-hidden="true">|</span>
      <a href="/about">Careers</a>
      <span class="footer-divider" aria-hidden="true">|</span>
      <a href="/terms.html">Terms of Use</a>
      <span class="footer-divider" aria-hidden="true">|</span>
      <a href="/security.txt">Report Security Issues</a>
      <span class="footer-divider" aria-hidden="true">|</span>
      <a href="/privacy.html">Privacy Policy</a>
      <span class="footer-divider" aria-hidden="true">|</span>
      <span>© 2026 Vault PDF Portal</span>
    </nav>
  </footer>

  <script>
    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-submit');
    const emailInput = document.getElementById('reg-email');
    const passwordInput = document.getElementById('reg-password');
    const confirmInput = document.getElementById('reg-confirm');

    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const confirmError = document.getElementById('confirm-error');

    // Setup password show/hide toggles
    function setupPasswordToggle(toggleId, inputId) {
      const toggleBtn = document.getElementById(toggleId);
      const input = document.getElementById(inputId);
      if (!toggleBtn || !input) return;

      const eyeOpen = toggleBtn.querySelector('.eye-open');
      const eyeClosed = toggleBtn.querySelector('.eye-closed');

      toggleBtn.addEventListener('click', () => {
        const isPassword = input.getAttribute('type') === 'password';
        input.setAttribute('type', isPassword ? 'text' : 'password');
        toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        if (eyeOpen && eyeClosed) {
          eyeOpen.style.display = isPassword ? 'none' : 'block';
          eyeClosed.style.display = isPassword ? 'block' : 'none';
        }
      });
    }

    setupPasswordToggle('password-toggle', 'reg-password');
    setupPasswordToggle('confirm-toggle', 'reg-confirm');

    // Validation helpers
    function validateEmail() {
      const val = emailInput.value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!val) {
        emailInput.setAttribute('aria-invalid', 'true');
        emailError.textContent = 'Email address is required.';
        emailError.classList.add('visible');
        return false;
      } else if (!emailRegex.test(val)) {
        emailInput.setAttribute('aria-invalid', 'true');
        emailError.textContent = 'Please enter a valid email address.';
        emailError.classList.add('visible');
        return false;
      }
      emailInput.removeAttribute('aria-invalid');
      emailError.textContent = '';
      emailError.classList.remove('visible');
      return true;
    }

    function validatePassword() {
      const val = passwordInput.value;
      if (!val) {
        passwordInput.setAttribute('aria-invalid', 'true');
        passwordError.textContent = 'Password is required.';
        passwordError.classList.add('visible');
        return false;
      } else if (val.length < 8) {
        passwordInput.setAttribute('aria-invalid', 'true');
        passwordError.textContent = 'Password must be at least 8 characters.';
        passwordError.classList.add('visible');
        return false;
      }
      passwordInput.removeAttribute('aria-invalid');
      passwordError.textContent = '';
      passwordError.classList.remove('visible');
      return true;
    }

    function validateConfirm() {
      const pVal = passwordInput.value;
      const cVal = confirmInput.value;
      if (!cVal) {
        confirmInput.setAttribute('aria-invalid', 'true');
        confirmError.textContent = 'Please confirm your password.';
        confirmError.classList.add('visible');
        return false;
      } else if (pVal !== cVal) {
        confirmInput.setAttribute('aria-invalid', 'true');
        confirmError.textContent = 'Passwords do not match.';
        confirmError.classList.add('visible');
        return false;
      }
      confirmInput.removeAttribute('aria-invalid');
      confirmError.textContent = '';
      confirmError.classList.remove('visible');
      return true;
    }

    emailInput.addEventListener('blur', validateEmail);
    passwordInput.addEventListener('blur', validatePassword);
    confirmInput.addEventListener('blur', validateConfirm);

    [emailInput, passwordInput, confirmInput].forEach(inp => {
      inp.addEventListener('input', () => {
        if (inp === emailInput && emailError.classList.contains('visible')) validateEmail();
        if (inp === passwordInput && passwordError.classList.contains('visible')) validatePassword();
        if (inp === confirmInput && confirmError.classList.contains('visible')) validateConfirm();
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const emailValid = validateEmail();
      const passwordValid = validatePassword();
      const confirmValid = validateConfirm();

      if (!emailValid || !passwordValid || !confirmValid) {
        if (!emailValid) emailInput.focus();
        else if (!passwordValid) passwordInput.focus();
        else confirmInput.focus();
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Creating Account...</span>';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.className = 'auth-alert success';
          alertBox.innerHTML = `
            <div>
              <strong>Account Created!</strong><br>
              ${data.message}<br><br>
              ${data.otp ? `<div style="margin: 8px 0; padding: 8px 12px; background: rgba(79, 70, 229, 0.08); border-radius: 8px; font-size: 0.95rem;">Your 6-Digit OTP Code: <strong style="font-family: monospace; font-size: 1.25rem; color: #4F46E5; letter-spacing: 0.1em;">${data.otp}</strong></div>` : ''}
              <a href="${data.verifyLink}" class="btn-primary" style="display:inline-flex; width:auto; padding: 8px 18px; font-size:0.9rem; text-decoration:none; margin-top:8px;">Enter 6-Digit OTP Code &rarr;</a>
            </div>
          `;
          alertBox.style.display = 'flex';
          form.reset();
          setTimeout(() => {
            window.location.href = data.verifyLink;
          }, 1800);
        } else {
          alertBox.className = 'auth-alert error';
          alertBox.textContent = data.error || 'Registration failed.';
          alertBox.style.display = 'flex';
        }
      } catch (err) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'flex';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Create Account</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
      }
    });
  </script>
</body>
</html>
