<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — Vault PDF Portal</title>
  <meta name="description" content="Sign up for Vault PDF Portal to securely manage, privately share, and publish verified PDF documents.">
  <link rel="canonical" href="https://vault-pdf-portal.onrender.com/register">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/about.css">
  <link rel="stylesheet" href="/css/futuristic.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Ambient Light Accents -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Header / Navigation -->
  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="/" class="brand-link" aria-label="Vault PDF Portal Home">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span class="brand-name">Vault <span class="brand-highlight">PDF</span></span>
        </a>

        <nav class="nav-menu" id="nav-menu">
          <a href="/" class="nav-link" id="nav-link-home">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
          </a>
          <a href="/about" class="nav-link" id="nav-link-about">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="16" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
            <span>About</span>
          </a>
          <a href="/#documents" class="nav-link" id="nav-link-docs">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span>Documents</span>
          </a>
          <a href="/contact" class="nav-link" id="nav-link-contact">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Contact</span>
          </a>
        </nav>

        <div class="nav-actions">
          <div class="futuristic-nav-group">
            <button class="btn-hud-toggle" id="btn-hud-toggle" title="Toggle Quantum Cyber-Deck HUD Mode">
              <span class="hud-pulse-dot"></span>
              <span>HUD</span>
            </button>
          </div>
          <a href="/login" class="btn-nav-cta">
            <span>Sign In</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Vault PDF Portal to manage and privately share encrypted documents.</p>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form class="auth-form" id="register-form">
        <div class="auth-field">
          <label class="auth-label" for="reg-email">Email Address</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="reg-email" class="auth-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="reg-password">Password (min. 8 characters)</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="reg-password" class="auth-input" placeholder="••••••••••••" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="reg-confirm">Confirm Password</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="reg-confirm" class="auth-input" placeholder="••••••••••••" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="auth-btn-submit" id="btn-submit">
          <span>Create Account</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign In</a>
      </div>
    </div>
  </main>

  <script src="/js/futuristic.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (password !== confirm) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Passwords do not match.';
        alertBox.style.display = 'flex';
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Creating Account...</span>';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.className = 'auth-alert success';
          alertBox.innerHTML = `
            <div>
              <strong>Account Created!</strong><br>
              ${data.message}<br><br>
              ${data.otp ? `<div style="margin: 8px 0; padding: 8px 12px; background: rgba(124, 58, 237, 0.12); border-radius: 8px; font-size: 0.95rem;">Your 6-Digit OTP Code: <strong style="font-family: monospace; font-size: 1.25rem; color: var(--purple-primary); letter-spacing: 0.1em;">${data.otp}</strong></div>` : ''}
              <a href="${data.verifyLink}" class="auth-btn-submit" style="display:inline-flex; width:auto; padding: 8px 18px; font-size:0.9rem; text-decoration:none; margin-top:8px;">Enter 6-Digit OTP Code &rarr;</a>
            </div>
          `;
          alertBox.style.display = 'flex';
          form.reset();
          // Auto-navigate to OTP verification page after 1.8s
          setTimeout(() => {
            window.location.href = data.verifyLink;
          }, 1800);
        } else {
          alertBox.className = 'auth-alert error';
          alertBox.textContent = data.error || 'Registration failed.';
          alertBox.style.display = 'flex';
        }
      } catch (err) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'flex';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Create Account</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
      }
    });
  </script>
  <script src="/js/auth-nav.js"></script>
</body>
</html>
