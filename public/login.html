<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Vault PDF Portal</title>
  <meta name="description" content="Sign in to your Vault PDF Portal account to manage your documents and private sharing codes.">
  <link rel="canonical" href="https://vault-pdf-portal.onrender.com/login">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/about.css">
  <link rel="stylesheet" href="/css/futuristic.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Ambient Light Accents -->
  <div class="bg-ambient" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- Header / Navigation -->
  <header class="site-header" id="site-header">
    <div class="container">
      <div class="nav-wrapper">
        <a href="/" class="brand-link" aria-label="Vault PDF Portal Home">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
          <span class="brand-name">Vault <span class="brand-highlight">PDF</span></span>
        </a>

        <nav class="nav-menu" id="nav-menu">
          <a href="/" class="nav-link" id="nav-link-home">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
          </a>
          <a href="/about" class="nav-link" id="nav-link-about">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="16" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
            <span>About</span>
          </a>
          <a href="/#documents" class="nav-link" id="nav-link-docs">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span>Documents</span>
          </a>
          <a href="/contact" class="nav-link" id="nav-link-contact">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Contact</span>
          </a>
        </nav>

        <div class="nav-actions">
          <div class="futuristic-nav-group">
            <button class="btn-hud-toggle" id="btn-hud-toggle" title="Toggle Quantum Cyber-Deck HUD Mode">
              <span class="hud-pulse-dot"></span>
              <span>HUD</span>
            </button>
          </div>
          <a href="/register" class="btn-nav-cta">
            <span>Register</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-icon-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your secure documents and private sharing vault.</p>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form class="auth-form" id="login-form">
        <div class="auth-field">
          <label class="auth-label" for="login-email">Email Address</label>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="login-email" class="auth-input" placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="auth-field">
          <div class="auth-label">
            <label for="login-password">Password</label>
            <a href="/forgot-password">Forgot password?</a>
          </div>
          <div class="auth-input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="login-password" class="auth-input" placeholder="••••••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="auth-btn-submit" id="btn-submit">
          <span>Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account yet? <a href="/register">Sign Up</a>
      </div>
    </div>
  </main>

  <script src="/js/futuristic.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<span>Verifying...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.className = 'auth-alert success';
          alertBox.textContent = 'Login successful! Redirecting to dashboard...';
          alertBox.style.display = 'flex';
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 600);
        } else if (data.unverified) {
          alertBox.className = 'auth-alert error';
          alertBox.innerHTML = `
            <div>
              <strong>Email Not Verified:</strong><br>
              ${data.error}<br>
              ${data.verifyLink ? `<a href="${data.verifyLink}" style="color:inherit; font-weight:700; text-decoration:underline;">Click here to complete verification now &rarr;</a>` : ''}
            </div>
          `;
          alertBox.style.display = 'flex';
        } else {
          alertBox.className = 'auth-alert error';
          alertBox.textContent = data.error || 'Invalid email or password.';
          alertBox.style.display = 'flex';
        }
      } catch (err) {
        alertBox.className = 'auth-alert error';
        alertBox.textContent = 'Network error. Please try again.';
        alertBox.style.display = 'flex';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Sign In</span> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
      }
    });
  </script>
  <script src="/js/auth-nav.js"></script>
  <script src="/js/tracker.js"></script>
</body>
</html>
