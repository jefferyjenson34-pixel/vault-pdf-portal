<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault PDF Portal — Cryptographic Certificate Verification</title>
  <meta name="description" content="Verify the cryptographic authenticity and tamper-evident integrity of Vault PDF digital signatures and Certificates of Completion.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/futuristic.css">
  <link rel="stylesheet" href="/css/digital-signature.css">

  <style>
    :root {
      --bg-dark: #FAF9FC;
      --card-bg: #FFFFFF;
      --border-cyan: #D9D7DC;
      --accent-cyan: #4B3832;
      --accent-emerald: #1A7A38;
      --accent-rose: #D70015;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #FAF9FC;
      color: #4B3832;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .verify-navbar {
      background: #FFFFFF;
      border-bottom: 1px solid #D9D7DC;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #4B3832;
      font-weight: 700;
      font-size: 1.15rem;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #EDE9F6;
      border: 1px solid #D9D7DC;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4B3832;
      font-size: 1.1rem;
    }

    .btn-nav-back {
      color: #4B3832;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: #EDE9F6;
      border: 1px solid #D9D7DC;
      transition: all 0.2s ease;
    }

    .btn-nav-back:hover {
      background: #4B3832;
      color: #FFFFFF;
      border-color: #4B3832;
    }

    .verify-hero {
      max-width: 900px;
      margin: 40px auto 20px;
      padding: 0 24px;
      text-align: center;
    }

    .verify-hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      color: #4B3832;
    }

    .verify-hero p {
      color: #7A6A63;
      font-size: 1rem;
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .search-card {
      max-width: 760px;
      margin: 28px auto 40px;
      padding: 12px;
      background: #FFFFFF;
      border: 1px solid #D9D7DC;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(75, 56, 50, 0.08);
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      background: #FAF9FC;
      border: 1.5px solid #D9D7DC;
      border-radius: 10px;
      padding: 12px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      color: #4B3832;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #4B3832;
      box-shadow: 0 0 0 3px rgba(75, 56, 50, 0.15);
    }

    .search-btn {
      background: #4B3832;
      color: #ffffff;
      border: none;
      padding: 0 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .search-btn:hover {
      background: #3A2B26;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(75, 56, 50, 0.25);
    }

    .result-container {
      max-width: 900px;
      margin: 0 auto 60px;
      padding: 0 24px;
      width: 100%;
      box-sizing: border-box;
    }

    .verify-badge-banner {
      padding: 16px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .verify-badge-banner.is-valid {
      background: #EAF5ED;
      border: 1px solid #1A7A38;
      color: #1A7A38;
    }

    .verify-badge-banner.is-invalid {
      background: #FFEBEB;
      border: 1px solid #D70015;
      color: #D70015;
    }

    .cert-audit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .cert-audit-grid {
        grid-template-columns: 1fr;
      }
      .search-card {
        flex-direction: column;
      }
    }

    .audit-card {
      background: #FFFFFF;
      border: 1px solid #D9D7DC;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 4px 12px rgba(75, 56, 50, 0.04);
    }

    .audit-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #7A6A63;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audit-val {
      font-size: 0.95rem;
      color: #4B3832;
      font-weight: 500;
      word-break: break-all;
    }

    .audit-val.mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #4B3832;
      background: #EDE9F6;
      border: 1px solid #D9D7DC;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .sig-preview-card {
      background: #FFFFFF;
      border: 1px solid #D9D7DC;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .sig-preview-card img {
      max-height: 80px;
      max-width: 240px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="verify-navbar">
    <a href="/" class="brand-wrap">
      <div class="brand-badge">🛡️</div>
      <span>Vault PDF Cryptographic Portal</span>
    </a>
    <a href="/" class="btn-nav-back">
      <span>← Back to Documents</span>
    </a>
  </header>

  <!-- Hero -->
  <div class="verify-hero">
    <h1>Cryptographic Certificate Verification</h1>
    <p>Verify document authenticity, cryptographic SHA-256 fingerprint, digital signature proof, and tamper-evident audit records.</p>
  </div>

  <!-- Search Input Bar -->
  <div class="search-card">
    <input type="text" id="cert-id-input" class="search-input" placeholder="Enter Certificate ID (e.g. CERT-489066BFD8F5)..." autocomplete="off" spellcheck="false">
    <button id="btn-verify" class="search-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Verify Certificate</span>
    </button>
  </div>

  <!-- Result Container -->
  <main class="result-container" id="result-container" style="display: none;"></main>

  <script>
    (function () {
      const input = document.getElementById('cert-id-input');
      const btn = document.getElementById('btn-verify');
      const container = document.getElementById('result-container');

      // Check URL parameters for ?id=
      const urlParams = new URLSearchParams(window.location.search);
      const urlId = urlParams.get('id');
      if (urlId) {
        input.value = urlId;
        runVerification(urlId);
      }

      btn.addEventListener('click', () => {
        const id = input.value.trim();
        if (id) runVerification(id);
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const id = input.value.trim();
          if (id) runVerification(id);
        }
      });

      async function runVerification(certId) {
        container.style.display = 'block';
        container.innerHTML = `
          <div style="text-align:center; padding: 40px; color:#7A6A63;">
            <div class="spinner-quantum" style="margin: 0 auto 16px; width:36px; height:36px; border:3px solid #D9D7DC; border-top-color:#4B3832; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
            <div>Querying Cryptographic Ledger for <strong>${certId}</strong>...</div>
          </div>
          <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        `;

        try {
          const res = await fetch(`/api/signatures/verify/${encodeURIComponent(certId)}`);
          const data = await res.json();

          if (!res.ok || !data.verified) {
            renderFailure(certId, data.error || 'Certificate not found or verification checksum mismatch.');
            return;
          }

          renderSuccess(data.certificate);
        } catch (err) {
          renderFailure(certId, err.message || 'Network error communicating with verification server.');
        }
      }

      function renderSuccess(cert) {
        const dateFormatted = new Date(cert.timestamp).toUTCString();
        const geoInfo = cert.geo ? `${cert.geo.city || ''}, ${cert.geo.country || ''}`.replace(/^, /, '') : 'Internal / Node Network';

        container.innerHTML = `
          <div class="verify-badge-banner is-valid">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:1.4rem;">🛡️</span>
              <div>
                <div style="font-size:1.05rem; font-weight:700;">CRYPTOGRAPHICALLY VERIFIED &amp; INTACT</div>
                <div style="font-size:0.8rem; opacity:0.85;">SHA-256 hash match confirmed • Tamper-evident checksum valid</div>
              </div>
            </div>
            <div style="font-family:'JetBrains Mono', monospace; font-size:0.85rem; background:#EAF5ED; color:#1A7A38; border:1px solid #1A7A38; padding:4px 10px; border-radius:6px;">
              ${cert.id}
            </div>
          </div>

          <div class="cert-audit-grid">
            <div class="audit-card">
              <div class="audit-label">📄 Document Title</div>
              <div class="audit-val">${escapeHtml(cert.documentName)}</div>
            </div>
            <div class="audit-card">
              <div class="audit-label">👤 Signer Identity</div>
              <div class="audit-val">${escapeHtml(cert.signerName)} &lt;${escapeHtml(cert.signerEmail)}&gt;</div>
            </div>
            <div class="audit-card">
              <div class="audit-label">🕒 Timestamp (UTC)</div>
              <div class="audit-val">${dateFormatted}</div>
            </div>
            <div class="audit-card">
              <div class="audit-label">🌐 Signer IP &amp; Geolocation</div>
              <div class="audit-val">${cert.signerIP} (${geoInfo})</div>
            </div>
            <div class="audit-card" style="grid-column: 1 / -1;">
              <div class="audit-label">🔐 Document SHA-256 Digest</div>
              <div class="audit-val mono">${cert.documentHash}</div>
            </div>
            <div class="audit-card" style="grid-column: 1 / -1;">
              <div class="audit-label">🖋️ Signature Cryptographic Digest</div>
              <div class="audit-val mono">${cert.signatureHash}</div>
            </div>
            <div class="audit-card">
              <div class="audit-label">⚙️ Signing Method</div>
              <div class="audit-val" style="text-transform: capitalize;">${cert.signatureType} Signature</div>
            </div>
            <div class="audit-card">
              <div class="audit-label">🛡️ Verification Protocol</div>
              <div class="audit-val mono" style="font-size:0.8rem;">HMAC-SHA256 • Vault-Signature-v1</div>
            </div>
          </div>

          ${cert.signatureData ? `
          <!-- Signature Render -->
          <div class="audit-card" style="text-align: center;">
            <div class="audit-label" style="justify-content:center;">Recorded Digital Signature</div>
            <div class="sig-preview-card">
              <img src="${cert.signatureData}" alt="Signer Digital Signature">
            </div>
          </div>
          ` : ''}

          <div style="margin-top:24px; text-align:center;">
            <button class="btn-nav-back" style="display:inline-flex; cursor:pointer;" onclick="window.print()">
              🖨️ Print / Save Verification Audit Record
            </button>
          </div>
        `;
      }

      function renderFailure(certId, msg) {
        container.innerHTML = `
          <div class="verify-badge-banner is-invalid">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:1.4rem;">⚠️</span>
              <div>
                <div style="font-size:1.05rem; font-weight:700;">VERIFICATION FAILED OR NOT FOUND</div>
                <div style="font-size:0.82rem; opacity:0.85;">${escapeHtml(msg)}</div>
              </div>
            </div>
            <div style="font-family:'JetBrains Mono', monospace; font-size:0.85rem; background:#FFEBEB; color:#D70015; border:1px solid #D70015; padding:4px 10px; border-radius:6px;">
              ${escapeHtml(certId)}
            </div>
          </div>
        `;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    })();
  </script>
</body>
</html>
